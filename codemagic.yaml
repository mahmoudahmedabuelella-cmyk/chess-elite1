workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.chess.elite"
      node: v18.16.0
    scripts:
      - name: Unzip Project Files
        script: |
          unzip -o "Chess_Elite_Android_Project (1).zip"
      - name: Fix and Build Android APK
        script: |
          # الدخول لفولدر المشروع
          GRADLE_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$GRADLE_DIR"
          
          # أمر سحري لتصليح خطأ التعارض القديم جوه الملفات أوتوماتيك
          if [ -f "settings.gradle" ]; then
            sed -i '' 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle || true
          fi
          
          # توليد ملف gradlew الناقص
          gradle wrapper
          
          # بناء ملف الـ APK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
