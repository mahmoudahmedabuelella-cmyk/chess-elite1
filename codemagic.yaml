workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.chess.elite"
      node: v18.16.0
    scripts:
      - name: Unzip Project Files
        script: |
          unzip -o "Chess_Elite_Android_Project (1).zip"
      - name: Build Android APK
        script: |
          # البحث عن الفولدر اللي جواه ملف البناء والدخول فيه أوتوماتيك
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: gradlew not found anywhere!"
            exit 1
          fi
          cd "$GRADLE_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
