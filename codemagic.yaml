workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.chess.elite"
      node: v18.16.0
    scripts:
      - name: Unzip Project Files
        script: |
          unzip -o "Chess_Elite_Android_Project (1).zip"
      - name: Fix and Build Android APK
        script: |
          GRADLE_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$GRADLE_DIR"
          
          # استبدال ملف الإعدادات بالكامل بنسخة نظيفة مفيهاش تعارض
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "Chess Elite"
          include ':app'
          EOF
          
          # توليد ملف البناء وبدء الطبخ
          gradle wrapper
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
