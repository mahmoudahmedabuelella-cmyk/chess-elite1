workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      node: v18.16.0
    scripts:
      - name: Unzip Project Files
        script: |
          unzip -o "Chess_Elite_Android_Project (1).zip"
      - name: Fix and Build Android APK
        script: |
          cd android
          
          # استبدال ملف الإعدادات بالنسخة النظيفة
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "Chess Elite"
          include ':app'
          EOF
          
          # سحب الـ Namespace وزرعها
          REAL_PACKAGE=$(grep -o 'package="[^"]*"' app/src/main/AndroidManifest.xml | cut -d'"' -f2 | head -n 1)
          if [ -z "$REAL_PACKAGE" ]; then
            REAL_PACKAGE="com.chess.elite"
          fi
          perl -pi -e "s/android \{/android \{\n    namespace '${REAL_PACKAGE}'/g" app/build.gradle
          
          # إزالة الـ package القديم عشان التحذيرات
          perl -pi -e 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          
          # الحل السحري: إزالة طلب الأيقونة المفقودة عشان يبني بالأيقونة الافتراضية
          perl -pi -e 's/android:icon="[^"]*"//g' app/src/main/AndroidManifest.xml
          perl -pi -e 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml
          
          # توليد ملف البناء وبدء الطبخ
          gradle wrapper
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
